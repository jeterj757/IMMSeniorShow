<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMM Senior Show 2026 — Hunt QR Sheet</title>
  <style>
  :root {
    --forest: #123f36;
    --paper: #f3edda;
    --ink: #1c2422;
    --line: #d4c9ad;
    --gp: #c75145;
    --vs: #cd7028;
    --mt: #d6a034;
    --df: #4e985f;
    --cc: #3f6f9b;
    --ct: #8d5aa9;
    --ui: "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ece7d7;
    color: var(--ink);
    font-family: var(--ui);
  }

  .qr-page {
    width: min(100%, 1080px);
    margin: 0 auto;
    padding: 28px 20px 36px;
  }

  .qr-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
    border-bottom: 3px solid var(--forest);
    padding-bottom: 16px;
  }

  .qr-kicker {
    margin: 0 0 5px;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #4f675d;
  }

  h1 {
    margin: 0;
    color: var(--forest);
    font-size: clamp(2rem, 4.6vw, 4rem);
    line-height: 0.95;
    letter-spacing: 0.01em;
  }

  .qr-meta {
    text-align: right;
    font-size: 0.9rem;
    line-height: 1.35;
    color: #47564f;
    font-weight: 700;
  }

  .qr-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .qr-card {
    --track: var(--forest);
    background: #fffaf0;
    border: 2px solid color-mix(in srgb, var(--track) 56%, #fff 44%);
    border-radius: 10px;
    padding: 14px;
    min-height: 310px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    break-inside: avoid;
  }

  .qr-track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .qr-track strong {
    font-size: 1.06rem;
    line-height: 1.05;
    color: var(--track);
  }

  .qr-code-key {
    border-radius: 999px;
    background: var(--track);
    color: white;
    padding: 5px 9px 4px;
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .qr-box {
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .qr-box img {
    width: min(100%, 190px);
    aspect-ratio: 1;
    display: block;
  }

  .qr-url {
    overflow-wrap: anywhere;
    color: #40534a;
    font-size: 0.74rem;
    line-height: 1.35;
    font-weight: 650;
  }

  .qr-note {
    margin: 18px 0 0;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(18,63,54,0.08);
    color: #31443b;
    font-size: 0.86rem;
    line-height: 1.4;
    font-weight: 650;
  }

  @media (max-width: 760px) {
    .qr-head { display: block; }
    .qr-meta { text-align: left; margin-top: 10px; }
    .qr-grid { grid-template-columns: 1fr; }
  }

  @media print {
    @page { size: letter; margin: 0.35in; }
    body { background: white; }
    .qr-page { width: auto; padding: 0; }
    .qr-grid { gap: 0.12in; }
    .qr-card { min-height: 3.05in; padding: 0.12in; }
    .qr-note { display: none; }
  }
  </style>
</head>
<body>
  <main class="qr-page">
    <header class="qr-head">
      <div>
        <p class="qr-kicker">IMM Senior Show 2026</p>
        <h1>Hunt QR Codes</h1>
      </div>
      <div class="qr-meta">
        Friday, May 8, 2026 · 5-9 PM<br>
        Live /hunt URLs · Print one code per track poster
      </div>
    </header>

    <section class="qr-grid" id="qrGrid" aria-label="Scavenger hunt QR codes"></section>

    <p class="qr-note">
      Default target is <strong>https://www.immseniorshow.com/hunt</strong>. If the Squarespace hunt page uses a different slug, change <strong>HUNT_BASE_URL</strong> near the bottom of this file before printing.
    </p>
  </main>

  <script>
  (function () {
    'use strict';

    var HUNT_BASE_URL = 'https://www.immseniorshow.com/hunt';
    var TRACKS = [
      { key: 'gp', label: 'Games and Playable Media', color: '#c75145' },
      { key: 'vs', label: 'Visual Storytelling', color: '#cd7028' },
      { key: 'mt', label: 'Music Technology', color: '#d6a034' },
      { key: 'df', label: 'Digital Fabrication', color: '#4e985f' },
      { key: 'cc', label: 'Creative Coding', color: '#3f6f9b' },
      { key: 'ct', label: 'Culture and Technology', color: '#8d5aa9' }
    ];

    function stopUrl(key) {
      return HUNT_BASE_URL + '?unlock=' + encodeURIComponent(key);
    }

    function qrSrc(url) {
      return 'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=14&data=' + encodeURIComponent(url);
    }

    var grid = document.getElementById('qrGrid');
    TRACKS.forEach(function (track) {
      var url = stopUrl(track.key);
      var card = document.createElement('article');
      card.className = 'qr-card';
      card.style.setProperty('--track', track.color);
      card.innerHTML =
        '<div class="qr-track"><strong>' + track.label + '</strong><span class="qr-code-key">/' + track.key + '</span></div>' +
        '<div class="qr-box"><img src="' + qrSrc(url) + '" alt="QR code for ' + track.label + ' hunt stop"></div>' +
        '<div class="qr-url">Poster stop URL: ' + url + '</div>';
      grid.appendChild(card);
    });
  }());
  </script>
</body>
</html>
